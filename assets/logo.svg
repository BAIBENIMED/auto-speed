<svg width="650" height="150" viewBox="0 0 650 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800&amp;display=swap');
            .text-base { 
                font-family: 'Outfit', sans-serif; 
                font-weight: 800; 
                font-size: 80px; 
            }
        </style>
    </defs>
    
    <!-- Main Group Centered -->
    <g transform="translate(20, 100)">
        <!-- AUTO in Dark/Black -->
        <text class="text-base" fill="#1A1A1A" x="0" y="0">AUTO</text>
        
        <!-- SPEED in Red -->
        <text class="text-base" fill="#D32F2F" x="260" y="0">SPEED</text>

        <!-- Dynamic Speed Lines Accent under SPEED -->
        <g transform="translate(265, 15)">
            <rect x="0" y="0" width="220" height="6" rx="3" fill="#D32F2F" />
            <rect x="230" y="0" width="50" height="6" rx="3" fill="#D32F2F" opacity="0.6" />
            <rect x="288" y="0" width="20" height="6" rx="3" fill="#D32F2F" opacity="0.4" />
        </g>
    </g>
</svg>
